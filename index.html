        #loginBox label { display:block; margin:10px 0 4px; font-weight:600; }

        #loginBox button { width:100%; margin-top:12px; padding:10px; background:#2b7be4; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer; }
        #loginBox button:hover { background:#1f6ad0; }
        #loginBox .error { color:red; font-size:13px; margin-top:6px; display:none; }
        #loginBox .register-link { text-align:center; margin-top:12px; font-size:14px; }

        #registerForm { display:none; margin-top:16px; border-top:1px solid #eee; padding-top:16px; }
        .custom-control {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.9); padding: 6px 8px 6px 10px; border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2); z-index: 1000;
            display: flex; flex-direction: column; gap: 3px; align-items: center;
            width: auto; max-height: 90vh; overflow: visible;
        }
        .custom-control button, .custom-control .dropdown-btn {
            width: 25px; height: 25px; border: 1px solid #888; border-radius: 4px;
            background: #fff; color: #333; font-size: 11px; font-weight: bold;
            cursor: pointer; line-height: 25px; text-align: center; padding: 0; flex-shrink: 0;
        }
        .custom-control button:hover { background: #f0f0f0; }
        .custom-control button.active { background: #007bff; color: #fff; border-color: #007bff; }
        .custom-control button.radar-on { background: #28a745; color: #fff; border-color: #28a745; }
        .custom-control button.radar-off { background: #dc3545; color: #fff; border-color: #dc3545; }
        .custom-control button.sectors-on { background: #17a2b8; color: #fff; border-color: #17a2b8; }

        .custom-control button.delete-mode { background: #ff9800; color: #fff; border-color: #ff9800; }
        .custom-control button.map-on { background: #007bff; color: #fff; border-color: #007bff; }
        .custom-control button.map-off { background: #6c757d; color: #fff; border-color: #6c757d; }
        .custom-control button.a-on { background: #28a745; color: #fff; border-color: #28a745; }
        .custom-control button.a-off { background: #6c757d; color: #fff; border-color: #6c757d; }

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // ================================================================
            // 🔑 ULOGE – POSTAVITE STVARNE UID-OVE
            // ================================================================
            const OWNER_UID = 'VqJ1Yg0qLxOOE5tG0ijBLoUqxbu1';
            const CONFIRMER_UID = 'Rx1pbnADseegDXG5iErpyP7Xr3F3';
            const GRID_EDITOR_UID = 'Rx1pbnADseegDXG5iErpyP7Xr3F3';

            // ================================================================
            // 🔥 FIREBASE KONFIGURACIJA
            // ================================================================
            const firebaseConfig = {
                apiKey: "AIzaSyCiu6siFd6lfzD0JtQLnWkOE7mMb0NMGZA",
                authDomain: "planseta-ce461.firebaseapp.com",
                databaseURL: "https://planseta-ce461-default-rtdb.europe-west1.firebasedatabase.app",
                projectId: "planseta-ce461",
                storageBucket: "planseta-ce461.firebasestorage.app",
                messagingSenderId: "1050533199438",
                appId: "1:1050533199438:web:2806d191af87b4a9558d1f",
                measurementId: "G-SJPZ2SRCJ8"
            };

            let firebaseApp, firebaseDb, firebaseInitialized = false;
            try {
                firebaseApp = firebase.initializeApp(firebaseConfig);
                firebaseDb = firebase.database();
                firebaseInitialized = true;
                document.getElementById('firebaseStatusBtn').className = 'firebase-on';
                console.log('✅ Firebase inicijalizovan');
            } catch (e) {
                console.error('❌ Firebase init greška:', e);
                alert('Greška pri povezivanju na Firebase:\n' + e.message);
                return;
            }

            const auth = firebase.auth();
            let currentUser = null;

            // ================================================================
            // 📌 MAPA I DOM REFERENCE
            // ================================================================
            const map = L.map('map').setView([44.4, 17.5], 8);
            const tileUrl = 'https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png';
            const tileLayer = L.tileLayer(tileUrl, { maxZoom: 19, attribution: '© OpenStreetMap France' }).addTo(map);
            let mapVisible = true;
            document.getElementById('toggleMapBtn').addEventListener('click', function() {
                if (mapVisible) { map.removeLayer(tileLayer); mapVisible = false; this.className = 'map-off'; this.title = 'Prikaži mapu'; }
                else { tileLayer.addTo(map); mapVisible = true; this.className = 'map-on'; this.title = 'Sakrij mapu'; }
            });

            const mouseAzimuthDiv = document.getElementById('mouse-azimuth');
            const hoverTooltip = document.getElementById('hoverTooltip');
            const statusDiv = document.getElementById('status');
            const tableWrapper = document.getElementById('tableWrapper');
            const tableOverlay = document.getElementById('tableOverlay');

            // ================================================================
            // 📦 POMOĆNE FUNKCIJE
            // ================================================================
            const KM_PER_DEG_LAT = 111.32;
            function destination(lat, lon, bearingDeg, distanceKm) {
                const br = bearingDeg * Math.PI / 180;
                const dLat = distanceKm * Math.cos(br) / KM_PER_DEG_LAT;
                const dLon = distanceKm * Math.sin(br) / (KM_PER_DEG_LAT * Math.cos(lat * Math.PI / 180));
                return [lat + dLat, lon + dLon];
            }
            function generateSectorCoords(lat, lon, outerKm, innerKm, startDeg, endDeg, steps = 36) {
                let start = parseFloat(startDeg), end = parseFloat(endDeg);
                if (isNaN(start) || isNaN(end)) return null;
                if (end < start) end += 360;
                const coords = [];
                for (let i = 0; i <= steps; i++) {
                    const a = start + (end - start) * i / steps;
                    coords.push(destination(lat, lon, a, outerKm));
                }
                coords.push(destination(lat, lon, end, innerKm));
                for (let i = steps; i >= 0; i--) {
                    const a = start + (end - start) * i / steps;
                    coords.push(destination(lat, lon, a, innerKm));
                }
                coords.push(destination(lat, lon, start, outerKm));
                return coords;
            }
            function bearing(lat1, lon1, lat2, lon2) {
                const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
                const Δλ = (lon2 - lon1) * Math.PI / 180;
                const y = Math.sin(Δλ) * Math.cos(φ2);
                const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
                const θ = Math.atan2(y, x);
                return (θ * 180 / Math.PI + 360) % 360;
            }
            function haversine(lat1, lon1, lat2, lon2) {
                const R = 6371;
                const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
                const Δφ = (lat2 - lat1) * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(Δφ/2)**2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2)**2;
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c;
            }
            function pointInPolygon(lat, lon, polygon) {
                let coords = polygon;
                if (typeof polygon.getLatLngs === 'function') {
                    const rings = polygon.getLatLngs();
                    if (rings.length === 0) return false;
                    coords = rings[0];
                }
                if (!Array.isArray(coords) || coords.length === 0) return false;
                let inside = false;
                const n = coords.length;
                for (let i = 0, j = n - 1; i < n; j = i++) {
                    const xi = coords[i].lat, yi = coords[i].lng;
                    const xj = coords[j].lat, yj = coords[j].lng;
                    const intersect = ((yi > lon) !== (yj > lon)) &&
                        (lat < (xj - xi) * (lon - yi) / (yj - yi) + xi);
                    if (intersect) inside = !inside;
                }
                return inside;
            }
            function formatTimeHHMMSS(date) {
                if (!date || isNaN(date.getTime())) return '-';
                return String(date.getHours()).padStart(2, '0') + ':' +
                       String(date.getMinutes()).padStart(2, '0') + ':' +
                       String(date.getSeconds()).padStart(2, '0');
            }

            // ================================================================
            // 🔐 LOGIN / REGISTRACIJA
            // ================================================================
            const loginOverlay = document.getElementById('loginOverlay');
            const loginEmail = document.getElementById('loginEmail');
            const loginPassword = document.getElementById('loginPassword');
            const loginBtn = document.getElementById('loginBtn');
            const loginError = document.getElementById('loginError');
            const showRegisterLink = document.getElementById('showRegisterLink');
            const showLoginLink = document.getElementById('showLoginLink');
            const registerForm = document.getElementById('registerForm');
            const regEmail = document.getElementById('regEmail');
            const regPassword = document.getElementById('regPassword');
            const registerBtn = document.getElementById('registerBtn');

            loginBtn.addEventListener('click', () => {
                const email = loginEmail.value.trim();
                const pass = loginPassword.value.trim();
                if (!email || !pass) {
                    loginError.textContent = '✏️ Unesi email i lozinku.';
                    loginError.style.display = 'block';
                    return;
                }
                loginError.style.display = 'none';
                auth.signInWithEmailAndPassword(email, pass)
                    .catch(err => {
                        loginError.textContent = '❌ ' + err.message;
                        loginError.style.display = 'block';
                    });
            });

            registerBtn.addEventListener('click', () => {
                const email = regEmail.value.trim();
                const pass = regPassword.value.trim();
                if (!email || !pass || pass.length < 6) {
                    alert('Unesi ispravan email i lozinku (min 6 karaktera).');
                    return;
                }
                auth.createUserWithEmailAndPassword(email, pass)
                    .then(() => {
                        alert('✅ Nalog kreiran! Prijavljen si.');
                        registerForm.style.display = 'none';
                        showRegisterLink.style.display = 'inline';
                    })
                    .catch(err => alert('❌ ' + err.message));
            });

            showRegisterLink.addEventListener('click', (e) => {
                e.preventDefault();
                registerForm.style.display = 'block';
                showRegisterLink.style.display = 'none';
            });
            showLoginLink.addEventListener('click', (e) => {
                e.preventDefault();
                registerForm.style.display = 'none';
                showRegisterLink.style.display = 'inline';
            });

            // ================================================================
            // 📍 GLOBALNE VARIJABLE
            // ================================================================
            let bPoints = [];
            let bLayer = L.layerGroup().addTo(map);
            let bCounter = 0;
            let deleteMode = false;
            let activeA = null, activeAKey = null, filterByA = false;
            let sectorsByA = {}, allSectors = [], sectorsVisible = true;
            let greenCells = [], blueCells = [];

            // ================================================================
            // 🗺️ A MARKERI I SEKTORI
            // ================================================================
            const aIcon = L.divIcon({
                className: 'a-marker',
                html: '<div style="width:6px;height:6px;background:#cc0000;border-radius:50%;border:2px solid white;box-shadow:0 0 4px rgba(0,0,0,0.5);"></div>',
                iconSize: [10, 10],
                iconAnchor: [5, 5]
            });
            const aSelectedIcon = L.divIcon({
                className: 'a-selected-marker',
                html: '<div style="width:10px;height:10px;background:#ffcc00;border-radius:50%;border:2px solid #ff0000;box-shadow:0 0 8px rgba(255,0,0,0.8);"></div>',
                iconSize: [14, 14],
                iconAnchor: [7, 7]
            });

            const markerLayer = L.layerGroup().addTo(map);
            const pp8Layer = L.layerGroup().addTo(map);
            const pp6Layer = L.layerGroup().addTo(map);

            const lines = csvData.split('\n');
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const cols = line.split(',');
                if (cols.length < 26) continue;
                const fpgs = cols[0];
                const lat = parseFloat(cols[1]);
                const lon = parseFloat(cols[2]);
                if (isNaN(lat) || isNaN(lon)) continue;
                const key = lat + ',' + lon;
                if (!addedCoords[key]) {
                    addedCoords[key] = true;
                    const marker = L.marker([lat, lon], { icon: aIcon })
                        .addTo(markerLayer)
                        .bindPopup(`<b>${fpgs}</b><br>lat: ${lat}, lon: ${lon}`);
                    marker.on('mouseover', e => showHoverTooltip(fpgs, e.latlng));
                    marker.on('mouseout', () => hideHoverTooltip());
                    marker.on('click', function(e) {
                        if (activeA) activeA.marker.setIcon(aIcon);
                        activeA = { fpgs, lat, lon, marker };
                        activeA.marker.setIcon(aSelectedIcon);
                        activeAKey = fpgs;
                        filterByA = true;
                        document.getElementById('activeAName').textContent = fpgs;
                        updateSectorsVisibility();
                        updatePopups();
                        if (firebaseInitialized && activeARef) {
                            activeARef.set({ fpgs: fpgs, lat: lat, lon: lon });
                        }
                        L.DomEvent.stopPropagation(e);
                    });
                    markerData.push({ fpgs, lat, lon, marker });
                }
                const aKey = fpgs;
                if (!sectorsByA[aKey]) sectorsByA[aKey] = { pp8: [], pp6: [] };
                const pp8Pairs = [
                    [cols[5], cols[6]],
                    [cols[7], cols[8]],
                    [cols[9], cols[10]],
                    [cols[11], cols[12]]
                ];
                pp8Pairs.forEach(([start, end]) => {
                    if (start && end && start.trim() !== '' && end.trim() !== '') {
                        const coords = generateSectorCoords(lat, lon, 8, 4, start, end);
                        if (coords) {
                            const polygon = L.polygon(coords, {
                                color: '#cc0000',
                                weight: 1.5,
                                opacity: 0.8,
                                fillColor: '#ff0000',
                                fillOpacity: 0.1
                            });
                            allSectors.push({ polygon, type: 'pp8', aKey });
                            sectorsByA[aKey].pp8.push(polygon);
                            totalSectors++;
                        }
                    }
                });
                const pp6Pairs = [
                    [cols[13], cols[14]],
                    [cols[15], cols[16]],
                    [cols[17], cols[18]],
                    [cols[19], cols[20]]
                ];
                pp6Pairs.forEach(([start, end]) => {
                    if (start && end && start.trim() !== '' && end.trim() !== '') {
                        const coords = generateSectorCoords(lat, lon, 4.5, 2.25, start, end);
                        if (coords) {
                            const polygon = L.polygon(coords, {
                                color: '#0000cc',
                                weight: 1.5,
                                opacity: 0.8,
                                fillColor: '#0000ff',
                                fillOpacity: 0.1
                            });
                            allSectors.push({ polygon, type: 'pp6', aKey });
                            sectorsByA[aKey].pp6.push(polygon);
                            totalSectors++;
                        }
                    }
                });
            }
            document.getElementById('count').textContent = totalSectors;

            // ================================================================
            // FUNKCIJE ZA ULOGE – SA BYPASS ZA LOCALHOST
            // ================================================================
            function isOwner() {
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') return true;
                if (!currentUser) return false;
                return currentUser.uid === OWNER_UID;
            }

            function isConfirmer() {
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') return true;
                if (!currentUser) return false;
                return currentUser.uid === CONFIRMER_UID;
            }

            function isGridEditor() {
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') return true;
                if (!currentUser) return false;
                return currentUser.uid === GRID_EDITOR_UID;
            }

            function canConfirm() {
                return isOwner() || isConfirmer();
            }

            function canEditGrid() {
                return isOwner() || isGridEditor();
            }

            function updateOwnerUI() {
                const isOwnerBool = isOwner();
                const isConfirmerBool = isConfirmer();
                const isGridEditorBool = isGridEditor();

                // Dugmad za brisanje – samo vlasnik
                const deleteBtns = document.querySelectorAll('#clearBbtn, #deleteSelectedB');
                deleteBtns.forEach(btn => {
                    if (isOwnerBool) {
                        btn.classList.remove('delete-btn');
                        btn.classList.add('owner-active');
                    } else {
                        btn.classList.remove('owner-active');
                        btn.classList.add('delete-btn');
                    }
                });

                // Dugmad za kvadrate – vlasnik ili urednik
                const gridBtns = document.querySelectorAll('#gridBlue, #gridGreen, #gridRed, #gridReset');
                gridBtns.forEach(btn => {
                    if (isOwnerBool || isGridEditorBool) {
                        btn.classList.remove('grid-btn');
                        btn.classList.add('grid-active');
                    } else {
                        btn.classList.remove('grid-active');
                        btn.classList.add('grid-btn');
                    }
                });

                // Dugme za potvrde – SAMO vlasnik
                const confirmBtn = document.getElementById('showConfirmationsBtn');
                if (confirmBtn) {
                    confirmBtn.style.display = isOwnerBool ? 'inline-block' : 'none';
                }

                const badge = document.getElementById('permissionBadge');
                if (isOwnerBool) {
                    badge.textContent = '👑 Vlasnik (sve dozvole)';
                } else if (isConfirmerBool) {
                    badge.textContent = '✅ Potvrđivač (desni klik za potvrdu)';
                } else if (isGridEditorBool) {
                    badge.textContent = '🎨 Urednik kvadrata (bojenje)';
                } else {
                    badge.textContent = '👀 Samo čitanje';
                }
                console.log('UI ažuriran. Vlasnik?', isOwnerBool, 'Potvrđivač?', isConfirmerBool, 'Urednik kvadrata?', isGridEditorBool);
            }

            // ================================================================
            // FUNKCIJE ZA B TAČKE (samo vlasnik)
            // ================================================================
            function isPointInsideColoredCell(lat, lon) {
                for (let c of greenCells) {
                    if (lat >= c.latMin && lat <= c.latMax && lon >= c.lonMin && lon <= c.lonMax) return true;
                }
                return false;
            }

            function isPointInActiveASectors(lat, lon) {
                if (!activeAKey || !sectorsByA[activeAKey]) return false;
                const allPolys = [...sectorsByA[activeAKey].pp8, ...sectorsByA[activeAKey].pp6];
                for (let poly of allPolys) {
                    if (pointInPolygon(lat, lon, poly)) return true;
                }
                return false;
            }

            function saveBPointsToFirebase() {
                if (!firebaseInitialized || !isOwner() || !bPointsRef) return;
                const data = bPoints.map(row => ({
                    bIndex: row.bIndex,
                    bLat: row.bLat,
                    bLon: row.bLon,
                    bDate: row.bDate ? row.bDate.toISOString() : null,
                    bTime: row.bTime,
                    aName: row.aName,
                    az: row.az,
                    dist: row.dist,
                    pp8: row.pp8,
                    td6b: row.td6b,
                    pp8x: row.pp8x || 0,
                    td6bx: row.td6bx || 0,
                    confirmationTime: row.confirmationTime,
                    confirmationDate: row.confirmationDate ? row.confirmationDate.toISOString() : null
                }));
                bPointsRef.set(data).catch(err => console.warn('Firebase write error:', err));
            }

            function confirmBPoint(row, marker) {
                if (!canConfirm()) {
                    alert('⚠️ Nemate dozvolu za potvrđivanje.');
                    return;
                }
                if (row.confirmationTime) {
                    alert('Ova tačka je već potvrđena.');
                    return;
                }
                const pp8x = selectedPP8X;
                const td6bx = selectedTD6BX;
                const confirmNow = new Date();
                row.pp8x = pp8x;
                row.td6bx = td6bx;
                row.confirmationDate = confirmNow;
                row.confirmationTime = confirmNow.toLocaleString();

                const popupConfirmed =
                    `PP8 ${row.pp8} TD6B ${row.td6b} B#${row.bIndex}<br>A: ${row.aName}<br>lat: ${row.bLat}, lon: ${row.bLon}<br>Vrijeme: ${row.bTime}<br>Azimut: ${row.az.toFixed(1)}°<br>Dist: ${row.dist.toFixed(1)} km<br>PP8X: ${row.pp8x}, TD6BX: ${row.td6bx}<br>Potvrda: ${row.confirmationTime}`;
                marker.setPopupContent(popupConfirmed);

                if (hoveringBRow === row) {
                    showHoverTooltip(`B#${row.bIndex}  PP8:${row.pp8}  TD6B:${row.td6b}`, lastMouseLatLng || { lat: row.bLat, lng: row.bLon });
                    updateMouseAzimuth(lastMouseLatLng || { lat: row.bLat, lng: row.bLon });
                }

                if (firebaseInitialized && bPointsRef) {
                    if (isOwner()) {
                        saveBPointsToFirebase();
                    } else {
                        // Potvrđivač šalje zahtjev – čuvamo i email
                        const confirmRef = firebaseDb.ref('confirmations').push();
                        confirmRef.set({
                            bIndex: row.bIndex,
                            pp8x: pp8x,
                            td6bx: td6bx,
                            confirmationTime: confirmNow.toISOString(),
                            confirmedBy: currentUser ? currentUser.uid : 'unknown',
                            confirmedByEmail: currentUser ? currentUser.email : 'unknown'
                        }).then(() => {
                            console.log('✅ Zahtjev za potvrdu poslan.');
                        }).catch(err => {
                            console.error('❌ Greška pri slanju zahtjeva:', err);
                        });
                    }
                }

                if (tableOverlay.style.display === 'block') renderTable();
            }

            // ================================================================
            // ADD B POINT – OGRANIČENJE 8 km
            // ================================================================
            function addBPoint(lat, lon) {
                if (!isOwner()) {
                    alert('⚠️ Samo vlasnik može dodavati B tačke.');
                    return;
                }
                if (!activeA) {
                    alert('Prvo kliknite na A marker za centar.');
                    return;
                }
                if (!isPointInsideColoredCell(lat, lon)) {
                    alert('Tačka B mora biti unutar ZELENO obojene ćelije.');
                    return;
                }
                const dist = haversine(activeA.lat, activeA.lon, lat, lon);
                if (dist > 8) {
                    alert('Udaljenost od aktivnog A je veća od 8 km. Nije dozvoljeno.');
                    return;
                }
                if (isPointInActiveASectors(lat, lon)) {
                    alert('Tačka B se nalazi unutar sektora (PP8 ili PP6) aktivnog A. Nije dozvoljeno.');
                    return;
                }
                bCounter++;
                const now = new Date(), timeStr = now.toLocaleString();
                const az = bearing(activeA.lat, activeA.lon, lat, lon);
                const row = {
                    bIndex: bCounter,
                    bLat: lat,
                    bLon: lon,
                    bDate: now,
                    bTime: timeStr,
                    aName: activeA.fpgs,
                    az: az,
                    dist: dist,
                    pp8: selectedPP8,
                    td6b: selectedTD6B,
                    pp8x: 0,
                    td6bx: 0,
                    confirmationTime: null,
                    confirmationDate: null,
                    marker: null
                };
                bPoints.push(row);
                const popupInitial = `PP8 ${row.pp8} TD6B ${row.td6b} B$${bCounter}<br>A: ${row.aName}<br>lat: ${lat}, lon: ${lon}<br>Vrijeme: ${timeStr}<br>Azimut: ${az.toFixed(1)}°<br>Dist: ${dist.toFixed(1)} km<br>PP8X: -, TD6BX: -<br>Potvrda: -`;
                const marker = L.marker([lat, lon], { icon: bIcon })
                    .addTo(bLayer)
                    .bindPopup(popupInitial);
                marker.on('mouseover', e => {
                    const prefix = row.confirmationTime ? 'B#' : 'B$';
                    showHoverTooltip(`${prefix}${row.bIndex}  PP8:${row.pp8}  TD6B:${row.td6b}`, e.latlng);
                    hoveringBRow = row;
                    updateMouseAzimuth(e.latlng);
                });
                marker.on('mouseout', () => {
                    hideHoverTooltip();
                    hoveringBRow = null;
                    if (lastMouseLatLng) updateMouseAzimuth(lastMouseLatLng);
                });
                row.marker = marker;
                marker.on('contextmenu', function(e) {
                    L.DomEvent.stopPropagation(e);
                    L.DomEvent.preventDefault(e);
                    confirmBPoint(row, marker);
                });
                marker.on('click', function(e) {
                    if (deleteMode && isOwner()) {
                        deleteBPoint(row);
                        L.DomEvent.stopPropagation(e);
                        L.DomEvent.preventDefault(e);
                    }
                });
                updatePopups();
                updateMouseInfo();
                if (tableOverlay.style.display === 'block') renderTable();
                saveBPointsToFirebase();
            }

            function deleteBPoint(row) {
                if (!isOwner()) { alert('⚠️ Samo vlasnik može brisati.'); return; }
                if (row.marker) bLayer.removeLayer(row.marker);
                const idx = bPoints.indexOf(row);
                if (idx !== -1) bPoints.splice(idx, 1);
                updatePopups();
                if (tableOverlay.style.display === 'block') renderTable();
                deleteMode = false;
                const deleteBtn = document.getElementById('deleteSelectedB');
                deleteBtn.classList.remove('delete-mode');
                deleteBtn.textContent = '❌B';
                if (hoveringBRow === row) {
                    hoveringBRow = null;
                    if (lastMouseLatLng) updateMouseAzimuth(lastMouseLatLng);
                }
                saveBPointsToFirebase();
            }

            function clearBPoints() {
                if (!isOwner()) { alert('⚠️ Samo vlasnik može obrisati sve B tačke.'); return; }
                bLayer.clearLayers();
                bPoints = [];
                bCounter = 0;
                document.getElementById('bCount').textContent = '0';
                document.getElementById('bInACount').textContent = '0';
                updatePopups();
                updateMouseInfo();
                tableOverlay.style.display = 'none';
                deleteMode = false;
                const deleteBtn = document.getElementById('deleteSelectedB');
                deleteBtn.classList.remove('delete-mode');
                deleteBtn.textContent = '❌B';
                hoveringBRow = null;
                if (lastMouseLatLng) updateMouseAzimuth(lastMouseLatLng);
                saveBPointsToFirebase();
            }

            // ================================================================
            // B VISIBILITY, SECTORS
            // ================================================================
            function updateBVisibility() {
                if (!activeA) {
                    bPoints.forEach(row => {
                        if (row.marker) { row.marker.setIcon(bIcon); row.marker.setOpacity(1); }
                    });
                    document.getElementById('bInACount').textContent = '0';
                    return;
                }
                const aSectors = sectorsByA[activeAKey];
                if (!aSectors) {
                    bPoints.forEach(row => {
                        if (row.marker) { row.marker.setIcon(bIcon); row.marker.setOpacity(1); }
                    });
                    document.getElementById('bInACount').textContent = '0';
                    return;
                }
                const allPolys = [...aSectors.pp8, ...aSectors.pp6];
                let insideCount = 0;
                bPoints.forEach(row => {
                    const lat = row.bLat, lon = row.bLon;
                    let inside = false;
                    for (let poly of allPolys) {
                        if (pointInPolygon(lat, lon, poly)) { inside = true; break; }
                    }
                    if (inside) {
                        row.marker.setIcon(bIcon);
                        row.marker.setOpacity(1);
                        insideCount++;
                    } else {
                        row.marker.setIcon(bIconGray);
                        row.marker.setOpacity(0.5);
                    }
                });
                document.getElementById('bInACount').textContent = insideCount;

            function saveGridColorsToFirebase() {
                if (!firebaseInitialized || !canEditGrid() || !gridColorsRef) return;
                const data = {
                    greenCells: greenCells.map(c => ({ latMin: c.latMin, latMax: c.latMax, lonMin: c.lonMin, lonMax: c.lonMax })),
                    blueCells: blueCells.map(c => ({ latMin: c.latMin, latMax: c.latMax, lonMin: c.lonMin, lonMax: c.lonMax }))
                };
                gridColorsRef.set(data).catch(err => console.warn('Firebase write error:', err));
            }

            function loadGridColorsFromFirebase() {
                if (!firebaseInitialized || !gridColorsRef) return;
                gridColorsRef.once('value').then(snapshot => {
                    const data = snapshot.val();
                    if (data) {
                        if (data.greenCells) {
                            data.greenCells.forEach(c => {
                                if (!greenCells.some(g => g.latMin === c.latMin && g.latMax === c.latMax &&
                                        g.lonMin === c.lonMin && g.lonMax === c.lonMax)) {
                                    greenCells.push(c);
                                }
                            });
                        }
                        if (data.blueCells) {
                            data.blueCells.forEach(c => {
                                if (!blueCells.some(b => b.latMin === c.latMin && b.latMax === c.latMax &&
                                        b.lonMin === c.lonMin && b.lonMax === c.lonMax)) {
                                    blueCells.push(c);
                                }
                            });
                        }
                        gridCells.forEach(rect => {
                            const bounds = rect.getBounds();
                            const latMin = bounds.getSouth(), latMax = bounds.getNorth(),
                                  lonMin = bounds.getWest(), lonMax = bounds.getEast();
                            const isGreen = greenCells.some(c => c.latMin === latMin && c.latMax === latMax &&
                                c.lonMin === lonMin && c.lonMax === lonMax);
                            const isBlue = blueCells.some(c => c.latMin === latMin && c.latMax === latMax &&
                                c.lonMin === lonMin && c.lonMax === lonMax);
                            rect.setStyle({
                                color: isGreen ? '#00ff00' : isBlue ? '#0055ff' : 'black',
                                weight: isGreen || isBlue ? 3 : 2
                            });
                        });
                        console.log('Grid boje učitane iz Firebase.');
                    }
                }).catch(err => console.warn('Firebase read error:', err));
            }

            function listenGridColors() {
                if (!firebaseInitialized || !gridColorsRef) return;
                if (gridColorsListener) gridColorsListener.off();
                gridColorsListener = gridColorsRef;
                gridColorsListener.on('value', snapshot => {
                    const data = snapshot.val();
                    if (data) {
                        greenCells = [];
                        blueCells = [];
                        if (data.greenCells) {

                            const isGreen = greenCells.some(c => c.latMin === latMin && c.latMax === latMax &&

            function generateGrid() {
                const latStart = 42.2, latEnd = 45.3 + 10/60, latStep = 10/60;
                const lonStart = 16, lonEnd = 20 + 15/60, lonStep = 15/60;
                let redIndex = 0;
                for (let lat = latStart; lat < latEnd; lat += latStep) {
                    let stupacIndex = 0;
                    for (let lon = lonStart; lon < lonEnd; lon += lonStep) {
                        const bounds = [[lat, lon], [lat + latStep, lon + lonStep]];
                        const rect = L.rectangle(bounds, { color: 'black', weight: 2, fillOpacity: 0, interactive: true });
                        const latMin = lat, latMax = lat + latStep, lonMin = lon, lonMax = lon + lonStep;
                        const redBroj = 29 - redIndex;
                        const slovoCode = 68 + stupacIndex + (stupacIndex >= 13 ? 1 : 0);
                        const slovo = String.fromCharCode(slovoCode);
                        const id = slovo + redBroj;
                        rect.on('mouseover', e => showHoverTooltip('ID: ' + id, e.latlng));
                        rect.on('mouseout', () => hideHoverTooltip());
                        rect.on('click', function(e) {
                            if (!canEditGrid()) {
                                alert('⚠️ Samo vlasnik ili urednik kvadrata može mijenjati boje.');
                                return;
                            }
                            if (selectedGridColor) {
                                let color = selectedGridColor === 'green' ? '#00ff00' :
                                            selectedGridColor === 'blue' ? '#0055ff' : '#ff0000';
                                this.setStyle({ color, weight: 3 });
                                if (selectedGridColor === 'green') {
                                    if (!greenCells.some(c => c.latMin === latMin && c.latMax === latMax &&
                                            c.lonMin === lonMin && c.lonMax === lonMax))
                                        greenCells.push({ latMin, latMax, lonMin, lonMax });
                                    const idx = blueCells.findIndex(c => c.latMin === latMin && c.latMax === latMax &&
                                        c.lonMin === lonMin && c.lonMax === lonMax);
                                    if (idx !== -1) blueCells.splice(idx, 1);
                                } else if (selectedGridColor === 'blue') {
                                    if (!blueCells.some(c => c.latMin === latMin && c.latMax === latMax &&
                                            c.lonMin === lonMin && c.lonMax === lonMax))
                                        blueCells.push({ latMin, latMax, lonMin, lonMax });
                                    const idx = greenCells.findIndex(c => c.latMin === latMin && c.latMax === latMax &&
                                        c.lonMin === lonMin && c.lonMax === lonMax);
                                    if (idx !== -1) greenCells.splice(idx, 1);
                                } else { // red
                                    const idxG = greenCells.findIndex(c => c.latMin === latMin && c.latMax === latMax &&
                                        c.lonMin === lonMin && c.lonMax === lonMax);
                                    if (idxG !== -1) greenCells.splice(idxG, 1);
                                    const idxB = blueCells.findIndex(c => c.latMin === latMin && c.latMax === latMax &&
                                        c.lonMin === lonMin && c.lonMax === lonMax);
                                    if (idxB !== -1) blueCells.splice(idxB, 1);
                                }
                                saveGridColorsToFirebase();
                                L.DomEvent.stopPropagation(e);
                            }
                        });
                        rect.on('contextmenu', function(e) {
                            if (!canEditGrid()) {
                                alert('⚠️ Samo vlasnik ili urednik kvadrata može brisati boje.');
                                return;
                            }
                            this.setStyle({ color: 'black', weight: 2 });
                            const idxG = greenCells.findIndex(c => c.latMin === latMin && c.latMax === latMax &&
                                c.lonMin === lonMin && c.lonMax === lonMax);
                            if (idxG !== -1) greenCells.splice(idxG, 1);
                            const idxB = blueCells.findIndex(c => c.latMin === latMin && c.latMax === latMax &&
                                c.lonMin === lonMin && c.lonMax === lonMax);
                            if (idxB !== -1) blueCells.splice(idxB, 1);
                            saveGridColorsToFirebase();
                            L.DomEvent.stopPropagation(e);
                            L.DomEvent.preventDefault(e);
                        });
                        rect.addTo(gridLayer);
                        gridCells.push(rect);
                        stupacIndex++;
                    }
                    redIndex++;
                }
            }
            generateGrid();

            function renderTable() {
                const data = buildTableData();
                if (data.length === 0) {
                    tableWrapper.innerHTML = '<p>Nema podataka. Dodajte B klikom na mapu (nakon odabira A).</p>';
                    return;
                }
                let html = '<table><thead><tr>';
                const headers = Object.keys(data[0]);
                headers.forEach(h => html += `<th>${h}</th>`);
                html += '</tr></thead><tbody>';
                data.forEach(row => {
                    html += '<tr>';
                    headers.forEach(h => html += `<td>${row[h]}</td>`);
                    html += '</tr>';
                });
                html += '</tbody></table>';
                tableWrapper.innerHTML = html;
            }

            // ================================================================
            // DUGME ZA POTVRDE – loadConfirmations() (samo vlasnik)
            // ================================================================
            function loadConfirmations() {
                if (!isOwner()) {
                    alert('⚠️ Samo vlasnik može vidjeti potvrde.');
                    return;
                }
                if (!firebaseInitialized) {
                    alert('🔥 Firebase nije inicijalizovan.');
                    return;
                }
                const confirmRef = firebaseDb.ref('confirmations');
                confirmRef.once('value').then(snapshot => {
                    const data = snapshot.val();
                    if (!data) {
                        alert('ℹ️ Nema potvrda u bazi.');
                        return;
                    }
                    const confirmations = Object.values(data);
                    if (confirmations.length === 0) {
                        alert('ℹ️ Nema potvrda.');
                        return;
                    }
                    confirmations.sort((a, b) => new Date(b.confirmationTime) - new Date(a.confirmationTime));

                    let html = '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;display:flex;justify-content:center;align-items:center;">';
                    html += '<div style="background:white;padding:20px;border-radius:8px;max-width:80%;max-height:80%;overflow:auto;box-shadow:0 0 20px rgba(0,0,0,0.5);">';
                    html += '<h3 style="margin-top:0;">📋 Potvrde (sve)</h3>';
                    html += '<button onclick="this.closest(\'div[style*=\'position:fixed\']\').remove()" style="float:right;background:#dc3545;color:#fff;border:none;border-radius:4px;padding:4px 12px;cursor:pointer;">✕ Zatvori</button>';
                    html += '<table style="width:100%;border-collapse:collapse;font-size:13px;">';
                    html += '<thead><tr><th>B redni</th><th>PP8X</th><th>TD6BX</th><th>Vrijeme potvrde</th><th>Potvrdio (email)</th></tr></thead><tbody>';
                    confirmations.forEach(c => {
                        const time = c.confirmationTime ? new Date(c.confirmationTime).toLocaleString() : '-';
                        const email = c.confirmedByEmail || c.confirmedBy || 'nepoznat';
                        html += `<tr><td>${c.bIndex}</td><td>${c.pp8x}</td><td>${c.td6bx}</td><td>${time}</td><td>${email}</td></tr>`;
                    });
                    html += '</tbody></table>';
                    html += '</div></div>';

                    const modalContainer = document.createElement('div');
                    modalContainer.innerHTML = html;
                    const modalElement = modalContainer.firstElementChild;
                    document.body.appendChild(modalElement);

                    modalElement.addEventListener('click', function(e) {
                        if (e.target === this) {
                            this.remove();
                        }
                    });
                }).catch(err => alert('❌ Greška pri učitavanju potvrda:\n' + err.message));
            }

            function showHoverTooltip(text, latlng) {
                hoverTooltip.textContent = text;

                const point = map.latLngToContainerPoint(latlng);
                hoverTooltip.style.left = (point.x + 10) + 'px';

            }
            function hideHoverTooltip() {
                hoverTooltip.style.display = 'none';

            }

            function updateMouseAzimuth(latlng) {
                let html = '';
                if (currentKmzName) {
                    const dateStr = currentKmzModified ? new Date(currentKmzModified).toLocaleString() : '';
                    const sizeStr = currentKmzSize ? (currentKmzSize / 1024).toFixed(1) + ' KB' : '';
                    html += `📄 ${currentKmzName}${dateStr ? '  ' + dateStr : ''}${sizeStr ? '  (' + sizeStr + ')' : ''}<br>`;
                }
                if (!activeA) {
                    html += 'Nema aktivnog A<br>Kliknite na A marker';
                    mouseAzimuthDiv.innerHTML = html;
                    return;
                }
                const az = bearing(activeA.lat, activeA.lon, latlng.lat, latlng.lng);
                const dist = haversine(activeA.lat, activeA.lon, latlng.lat, latlng.lng);
                html += `Azimut od A (${activeA.fpgs}): ${az.toFixed(1)}°<br>Udaljenost: ${dist.toFixed(1)} km`;
                if (hoveringBRow) html += `<br>PP8: ${hoveringBRow.pp8}  TD6B: ${hoveringBRow.td6b}`;
                if (pngOverlay && pngVisible && pngImgWidth && pngImgHeight) {
                    const [latMin, lonMin] = PNG_BOUNDS[0];
                    const [latMax, lonMax] = PNG_BOUNDS[1];
                    if (latlng.lat >= latMin && latlng.lat <= latMax && latlng.lng >= lonMin && latlng.lng <= lonMax) {
                        const px = ((latlng.lng - lonMin) / (lonMax - lonMin)) * pngImgWidth;
                        const py = ((latMax - latlng.lat) / (latMax - latMin)) * pngImgHeight;
                        html += `<br>Piksel: ${Math.round(px)}, ${Math.round(py)}`;
                    }
                }
                mouseAzimuthDiv.innerHTML = html;
            }

            function updateMouseInfo() {
                if (!activeA) { mouseAzimuthDiv.innerHTML = 'Nema aktivnog A<br>Kliknite na A marker'; return; }
                if (lastMouseLatLng) updateMouseAzimuth(lastMouseLatLng);
            }

            map.on('mousemove', function(e) {
                lastMouseLatLng = e.latlng;
                updateMouseAzimuth(e.latlng);
            });

            map.on('click', function(e) {
                addBPoint(e.latlng.lat, e.latlng.lng);

                    this.title = 'Prikaži sve A tačke';
                } else {
                    map.addLayer(markerLayer);
                    aVisible = true;
                    this.className = 'a-on';
                    this.title = 'Sakrij sve A tačke';
                }
            });

            document.getElementById('showTableBtn').addEventListener('click', function() {
                if (tableOverlay.style.display === 'block') {
                    tableOverlay.style.display = 'none';
                } else {
                    tableOverlay.style.display = 'block';
                    renderTable();
                }
            });

            document.getElementById('openTableTabBtn').addEventListener('click', function() {
                const data = buildTableData();
                if (data.length === 0) { alert('❌ Nema podataka za prikaz.'); return; }
                let html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Tabela A-B</title>';
                html += '<style>body{font-family:sans-serif;padding:15px;max-width:70%;margin:0 auto;background:#f9f9f9;}';
                html += 'table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;box-shadow:0 0 10px rgba(0,0,0,0.1);}';
                html += 'th,td{border:1px solid #ccc;padding:6px 8px;text-align:center;vertical-align:middle;}';
                html += 'th{background:#f0f0f0;position:sticky;top:0;}tr:nth-child(even){background:#fafafa;}tr:hover{background:#eef4ff;}</style></head><body>';
                html += '<h2>Presjek A-B (PP8, PP8X, TD6B, TD6BX)</h2>';
                html += '<table><thead><tr>';
                const headers = Object.keys(data[0]);
                headers.forEach(h => html += `<th>${h}</th>`);
                html += '</tr></thead><tbody>';
                data.forEach(row => {
                    html += '<tr>';
                    headers.forEach(h => html += `<td>${row[h]}</td>`);
                    html += '</tr>';
                });
                html += '</tbody></table></body></html>';
                const newWindow = window.open('', '_blank');
                if (newWindow) { newWindow.document.write(html); newWindow.document.close(); }
                else alert('❌ Iskačući prozor je blokiran.');
            });

            document.getElementById('closeTableBtn').addEventListener('click', function() {
                tableOverlay.style.display = 'none';
            });

            document.getElementById('exportExcelBtn').addEventListener('click', function() {
                const data = buildTableData();
                if (data.length === 0) { alert('❌ Nema podataka za export.'); return; }
                try {
                    const ws = XLSX.utils.json_to_sheet(data);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, 'Presjek');
                    const now = new Date();
                    const year = now.getFullYear();
                    const month = String(now.getMonth()+1).padStart(2,'0');
                    const day = String(now.getDate()).padStart(2,'0');
                    const hours = String(now.getHours()).padStart(2,'0');
                    const minutes = String(now.getMinutes()).padStart(2,'0');
                    const seconds = String(now.getSeconds()).padStart(2,'0');
                    const fileName = `presjek_AB_${year}${month}${day}_${hours}${minutes}${seconds}.xlsx`;
                    XLSX.writeFile(wb, fileName);
                    alert('✅ Excel fajl uspješno sačuvan:\n' + fileName);
                } catch (e) { alert('❌ Greška pri exportu:\n' + e.message); }
            });

            // DUGME ZA POTVRDE – EVENT
            document.getElementById('showConfirmationsBtn').addEventListener('click', function() {
                loadConfirmations();
            });

            document.getElementById('clearBbtn').addEventListener('click', function() {
                if (!isOwner()) { alert('⚠️ Samo vlasnik može obrisati sve B tačke.'); return; }
                if (bPoints.length === 0) { alert('ℹ️ Nema tačaka B za brisanje.'); return; }
                if (!confirm(`⚠️ Obrisati svih ${bPoints.length} tačaka B?`)) return;
                clearBPoints();
                alert('✅ Sve B tačke su obrisane.');
            });

            const deleteBtn = document.getElementById('deleteSelectedB');
            deleteBtn.addEventListener('click', function() {
                if (!isOwner()) { alert('⚠️ Samo vlasnik može brisati B tačke.'); return; }
                deleteMode = !deleteMode;
                this.classList.toggle('delete-mode');
                this.textContent = deleteMode ? '❌B (aktivan)' : '❌B';
            });

            ['gridBlue','gridGreen','gridRed'].forEach(id => {
                document.getElementById(id).addEventListener('click', function() {
                    if (!canEditGrid()) {
                        alert('⚠️ Samo vlasnik ili urednik kvadrata može mijenjati boje.');
                        return;
                    }
                    const color = id === 'gridBlue' ? 'blue' : id === 'gridGreen' ? 'green' : 'red';
                    if (this.classList.contains('active')) {
                        this.classList.remove('active');
                        if (selectedGridColor === color) selectedGridColor = null;
                    } else {
                        this.classList.add('active');
                        ['gridBlue','gridGreen','gridRed'].forEach(c => {
                            if (c !== id) document.getElementById(c).classList.remove('active');
                        });
                        selectedGridColor = color;
                    }
                });
            });

            document.getElementById('gridReset').addEventListener('click', function() {
                if (!canEditGrid()) {
                    alert('⚠️ Samo vlasnik ili urednik kvadrata može resetovati boje.');
                    return;
                }
                gridCells.forEach(rect => rect.setStyle({ color: 'black', weight: 2 }));
                greenCells = [];
                blueCells = [];
                saveGridColorsToFirebase();
            });

            function setupDropdown(btnId, contentId, callback) {
                const btn = document.getElementById(btnId);
                const content = document.getElementById(contentId);
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    content.classList.toggle('show-dropdown');
                    document.querySelectorAll('.dropdown-content').forEach(el => {
                        if (el.id !== contentId) el.classList.remove('show-dropdown');
                    });
                });
                content.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const btnEl = e.target.closest('button');
                    if (!btnEl) return;
                    const val = btnEl.dataset.value;
                    if (val !== undefined) {
                        callback(parseInt(val));
                        btn.textContent = btn.textContent.split('-')[0] + '-' + val;
                        content.classList.remove('show-dropdown');
                    }
                });
            }
            setupDropdown('pp8DropdownBtn', 'pp8DropdownContent', v => selectedPP8 = v);
            setupDropdown('pp8xDropdownBtn', 'pp8xDropdownContent', v => selectedPP8X = v);
            setupDropdown('td6bDropdownBtn', 'td6bDropdownContent', v => selectedTD6B = v);
            setupDropdown('td6bxDropdownBtn', 'td6bxDropdownContent', v => selectedTD6BX = v);

            // ================================================================
            // 📁 UCITAJ KMZ (ručno)
            // ================================================================
            const loadKmzBtn = document.getElementById('loadKmzBtn');
            const fileInput = document.getElementById('fileInput');

            loadKmzBtn.addEventListener('click', function() {
                fileInput.click();
            });

            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    const arrayBuffer = event.target.result;
                    JSZip.loadAsync(arrayBuffer).then(function(zip) {
                        let imageFile = null;
                        let kmlFile = null;
                        zip.forEach(function(relativePath, zipEntry) {
                            if (zipEntry.name.match(/\.(png|jpg|jpeg)$/i)) {
                                imageFile = zipEntry;
                            } else if (zipEntry.name.match(/\.kml$/i)) {
                                kmlFile = zipEntry;
                            }
                        });
                        if (!imageFile) {
                            alert('Nije pronađena slika u KMZ fajlu.');
                            fileInput.value = '';
                            return;
                        }
                        imageFile.async('blob').then(function(blob) {
                            const url = URL.createObjectURL(blob);

                            function addOverlay(bounds) {
                                if (pngOverlay) {
                                    map.removeLayer(pngOverlay);
                                }
                                pngOverlay = L.imageOverlay(url, bounds, { opacity: 0.7 }).addTo(map);
                                pngVisible = true;
                                document.getElementById('radarToggle').className = 'radar-on';
                                document.getElementById('radarToggle').textContent = '🖼️ ON';
                                fileInput.value = '';
                            }

                            if (kmlFile) {
                                kmlFile.async('text').then(function(kmlText) {
                                    try {
                                        const parser = new DOMParser();
                                        const xml = parser.parseFromString(kmlText, 'text/xml');
                                        const latLonBox = xml.querySelector('LatLonBox');
                                        if (latLonBox) {
                                            const north = parseFloat(latLonBox.querySelector('north').textContent);
                                            const south = parseFloat(latLonBox.querySelector('south').textContent);
                                            const east = parseFloat(latLonBox.querySelector('east').textContent);
                                            const west = parseFloat(latLonBox.querySelector('west').textContent);
                                            if (!isNaN(north) && !isNaN(south) && !isNaN(east) && !isNaN(west)) {
                                                addOverlay([[south, west], [north, east]]);
                                                return;
                                            }
                                        }
                                        const center = map.getCenter();
                                        const half = 0.05;
                                        addOverlay([[center.lat - half, center.lng - half], [center.lat + half, center.lng + half]]);
                                    } catch (err) {
                                        console.warn('Greška pri parsiranju KML:', err);
                                        const center = map.getCenter();
                                        const half = 0.05;
                                        addOverlay([[center.lat - half, center.lng - half], [center.lat + half, center.lng + half]]);
                                    }
                                }).catch(function(err) {
                                    console.warn('Greška pri čitanju KML:', err);
                                    const center = map.getCenter();
                                    const half = 0.05;
                                    addOverlay([[center.lat - half, center.lng - half], [center.lat + half, center.lng + half]]);
                                });
                            } else {
                                const center = map.getCenter();
                                const half = 0.05;
                                addOverlay([[center.lat - half, center.lng - half], [center.lat + half, center.lng + half]]);
                            }
                        }).catch(function(err) {
                            alert('Greška pri čitanju slike: ' + err.message);
                            fileInput.value = '';
                        });
                    }).catch(function(err) {
                        alert('Greška pri otvaranju KMZ fajla: ' + err.message);
                        fileInput.value = '';
                    });
                };
                reader.readAsArrayBuffer(file);
            });

            // ================================================================
            // 👁️ Radar toggle
            // ================================================================
            document.getElementById('radarToggle').addEventListener('click', function() {
                if (pngOverlay) {
                    if (map.hasLayer(pngOverlay)) {
                        map.removeLayer(pngOverlay);
                        this.className = 'radar-off';
                        this.textContent = '🖼️';
                    } else {
                        map.addLayer(pngOverlay);
                        this.className = 'radar-on';
                        this.textContent = '🖼️ ON';
                    }
                } else {
                    alert('Prvo učitajte KMZ fajl.');
                }
            });

            // ================================================================
            // 🌐 KOMUNIKACIJA SA NODE SERVEROM (auto-load + WebSocket)
            // ================================================================
            async function loadFromServer(endpoint = '/api/latest-kmz-png') {
                try {
                    const response = await fetch(endpoint);
                    const data = await response.json();
                    if (data.error) {
                        console.log('❌ Server greška:', data.error);
                        return false;
                    }
                    if (!data.success) {
                        console.log('❌ Neuspješno učitavanje:', data.error);
                        return false;
                    }

                    currentKmzName = data.name;
                    currentKmzModified = data.modified;
                    currentKmzSize = data.size;

                    const byteCharacters = atob(data.data);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) {
                        byteNumbers[i] = byteCharacters.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray], { type: data.mimeType || 'image/png' });
                    const url = URL.createObjectURL(blob);

                    const img = new Image();
                    img.onload = function() {
                        pngImgWidth = img.width;
                        pngImgHeight = img.height;
                        if (pngOverlay) map.removeLayer(pngOverlay);
                        pngOverlay = L.imageOverlay(url, PNG_BOUNDS, { opacity: 0.7, zIndex: 50, interactive: true })
                            .addTo(map);
                        pngVisible = true;
                        document.getElementById('radarToggle').className = 'radar-on';
                        document.getElementById('radarToggle').textContent = '🖼️ ON';
                        statusDiv.textContent = `✅ Server: ${data.name} (${new Date(data.modified).toLocaleString()})`;
                        statusDiv.style.display = 'block';
                        setTimeout(() => statusDiv.style.display = 'none', 3000);
                        if (lastMouseLatLng) updateMouseAzimuth(lastMouseLatLng);
                    };
                    img.onerror = function() {
                        if (pngOverlay) map.removeLayer(pngOverlay);
                        pngOverlay = L.imageOverlay(url, PNG_BOUNDS, { opacity: 0.7, zIndex: 50, interactive: true })
                            .addTo(map);
                        pngVisible = true;
                        document.getElementById('radarToggle').className = 'radar-on';
                        document.getElementById('radarToggle').textContent = '🖼️ ON';
                        statusDiv.textContent = `✅ Server: ${data.name}`;
                        statusDiv.style.display = 'block';
                        setTimeout(() => statusDiv.style.display = 'none', 3000);
                        if (lastMouseLatLng) updateMouseAzimuth(lastMouseLatLng);
                    };
                    img.src = url;

                    return true;
                } catch (error) {
                    console.error('❌ Greška pri učitavanju sa servera:', error);
                    return false;
                }
            }

            function connectWebSocket() {
                const ws = new WebSocket('ws://localhost:3000');

                ws.onopen = function() {
                    console.log('✅ WebSocket povezan sa serverom.');
                    ws.send(JSON.stringify({ type: 'getLatestKmz' }));
                };

                ws.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'newKmz' || data.type === 'latestKmz' || data.type === 'refresh') {
                            console.log('📡 Server javlja novi KMZ – osvježavam...');
                            loadFromServer('/api/latest-kmz-png');
                        } else if (data.type === 'connected') {
                            console.log('🔗 Server potvrdio konekciju.');
                        }
                    } catch (e) {
                        console.warn('Neispravna WebSocket poruka:', e);
                    }
                };

                ws.onerror = function(err) {
                    console.warn('⚠️ WebSocket greška:', err);
                };

                ws.onclose = function() {
                    console.warn('⚠️ WebSocket zatvoren, pokušaj ponovnog povezivanja za 5s...');
                    setTimeout(connectWebSocket, 5000);
                };

                return ws;
            }

            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.addEventListener('click', async function() {
                this.disabled = true;
                this.textContent = '⏳';
                await loadFromServer('/api/latest-kmz-png');
                this.textContent = '🔄';
                this.disabled = false;
            });

            setTimeout(async () => {
                await loadFromServer('/api/latest-kmz-png');
                connectWebSocket();
            }, 1500);

            // ================================================================
            // FIREBASE LISTENERI
            // ================================================================
            function startListening() {
                if (!firebaseInitialized) return;
                if (bPointsRef) listenBPoints();
                if (activeARef) {
                    activeARef.on('value', snapshot => {
                        const data = snapshot.val();
                        if (data) {
                            const found = markerData.find(m => m.fpgs === data.fpgs);
                            if (found) {
                                if (activeA) activeA.marker.setIcon(aIcon);
                                activeA = { fpgs: found.fpgs, lat: found.lat, lon: found.lon, marker: found.marker };
                                activeA.marker.setIcon(aSelectedIcon);
                                activeAKey = found.fpgs;
                                filterByA = true;
                                document.getElementById('activeAName').textContent = found.fpgs;
                                updateSectorsVisibility();
                                updatePopups();
                            }
                        } else {
                            if (activeA) {
                                activeA.marker.setIcon(aIcon);
                                activeA = null;
                                activeAKey = null;
                                document.getElementById('activeAName').textContent = '-';
                                filterByA = false;
                                updateSectorsVisibility();
                                updatePopups();
                            }
                        }
                    });
                }
                console.log('📡 Slušanje Firebase podataka aktivirano.');
            }

            // ================================================================
            // 🔐 AUTH STATE
            // ================================================================
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUser = user;
                    loginOverlay.style.display = 'none';
                    console.log('👤 Prijavljen:', user.email, 'UID:', user.uid);
                    setTimeout(() => {
                        updateOwnerUI();
                    }, 300);
                    if (firebaseInitialized) {
                        bPointsRef = firebaseDb.ref('bPoints');
                        gridColorsRef = firebaseDb.ref('gridColors');
                        activeARef = firebaseDb.ref('activeA');
                        startListening();
                        loadBPointsFromFirebase();
                        loadGridColorsFromFirebase();
                        listenGridColors();
                    }
                } else {
                    currentUser = null;
                    loginOverlay.style.display = 'flex';
                    updateOwnerUI();
                }
            });

            // ================================================================
            // 🚀 POKRENI
            // ================================================================
            updateSectorsVisibility();
            console.log('✅ Planseta pokrenuta sa 3 uloge.');
            console.log('👑 Vlasnik UID:', OWNER_UID);
            console.log('✅ Potvrđivač UID:', CONFIRMER_UID);
            console.log('🎨 Urednik kvadrata UID:', GRID_EDITOR_UID);
            console.log('🌐 Server komunikacija aktivirana (auto-load KMZ/PNG).');
            console.log('📏 Ograničenje udaljenosti B tačaka: 8 km.');
        });
    </script>
